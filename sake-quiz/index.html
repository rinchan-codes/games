<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒どころ手帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4efe4;
  --paper-2: #ebe3d2;
  --card: #fbf8f1;
  --ink: #1f3550;
  --ink-soft: #5d6c7f;
  --line: #cdc2ab;
  --shu: #c4432e;
  --shu-soft: rgba(196, 67, 46, .12);
  --focus: #2f6fb0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a24;
    --paper-2: #1b2430;
    --card: #19212c;
    --ink: #ece4d2;
    --ink-soft: #a2acb9;
    --line: #36424f;
    --shu: #e3664d;
    --shu-soft: rgba(227, 102, 77, .16);
    --focus: #7fb2e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a24;
  --paper-2: #1b2430;
  --card: #19212c;
  --ink: #ece4d2;
  --ink-soft: #a2acb9;
  --line: #36424f;
  --shu: #e3664d;
  --shu-soft: rgba(227, 102, 77, .16);
  --focus: #7fb2e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 72px; }
.mincho { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; }

header.top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 20px;
}
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .08em; font-weight: 700; }
header.top .count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.linkbtn {
  background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; font-size: 14px; color: var(--ink-soft);
}

.lead { margin: 0 0 20px; color: var(--ink-soft); font-size: 14px; }

.modes { display: grid; gap: 10px; }
.mode {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
}
.mode:hover { border-color: var(--ink); }
.mode b { font-size: 17px; }
.mode span { grid-column: 1; font-size: 13px; color: var(--ink-soft); }
.mode i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font-size: 13px; color: var(--ink-soft); }

.regions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.regions button {
  background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px 4px;
  cursor: pointer; font-size: 14px;
}
.regions button:hover { border-color: var(--ink); }

.section-label {
  font-size: 12px; letter-spacing: .15em; color: var(--ink-soft); margin: 28px 0 8px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
.pips { display: flex; gap: 4px; }
.pip { width: 14px; height: 4px; background: var(--line); border-radius: 2px; }
.pip.ok { background: var(--shu); }
.pip.ng { background: var(--ink-soft); }
.pip.now { background: var(--ink); }

.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 20px 18px; }
.qkind { font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); }
.qtext { font-size: 19px; margin: 6px 0 4px; font-weight: 500; }
.qsub { font-size: 14px; color: var(--ink-soft); margin: 0; }
.qbig { font-size: 30px; margin: 10px 0 2px; line-height: 1.3; word-break: break-all; }

.choices { display: grid; gap: 8px; margin-top: 16px; }
.choice {
  display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 10px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 12px;
  min-height: 52px;
}
.choice:hover:not([disabled]) { border-color: var(--ink); }
.choice .k {
  width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; color: var(--ink-soft);
}
.choice .t { word-break: break-all; }
.choice .t small { display: block; font-size: 12px; color: var(--ink-soft); }
.choice[disabled] { cursor: default; }
.choice.correct { border-color: var(--shu); background: var(--shu-soft); }
.choice.correct .k { border-color: var(--shu); color: var(--shu); font-weight: 700; }
.choice.wrong { border-style: dashed; color: var(--ink-soft); }
.choice.dim { opacity: .55; }

.verdict { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; }
.stamp {
  width: 56px; height: 56px; font-size: 13px !important; letter-spacing: 0; border: 2px solid var(--shu); border-radius: 50%;
  color: var(--shu); display: grid; place-items: center; font-weight: 700; font-size: 15px;
  transform: rotate(-8deg); flex: none;
}
.stamp.miss { border-color: var(--ink-soft); color: var(--ink-soft); transform: none; border-style: dashed; }
.verdict p { margin: 0; font-size: 15px; }

.info { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.info + .info { margin-top: 14px; }
.info h3 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.4; }
.info .kana { font-size: 12px; color: var(--ink-soft); }
.info dl { display: grid; grid-template-columns: 4.5em 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 14px; }
.info dt { color: var(--ink-soft); }
.info dd { margin: 0; word-break: break-all; }
.info .src { font-size: 12px; }
.info .src a { color: var(--ink-soft); }

.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn {
  background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 4px;
  padding: 10px 20px; cursor: pointer; font-weight: 500;
}
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { opacity: .88; }
.hint { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

/* result */
.score { font-size: 44px; margin: 4px 0; }
.score small { font-size: 18px; color: var(--ink-soft); }
.newstamps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.newstamps span { border: 1px solid var(--shu); color: var(--shu); border-radius: 3px; padding: 0 8px; font-size: 13px; }

/* book */
.map {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px;
  max-width: 560px; margin: 0 auto;
}
.tile {
  aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; background: var(--card);
  font-size: 11px; line-height: 1.1; padding: 0; cursor: pointer; color: var(--ink-soft);
  display: grid; place-items: center; text-align: center; overflow: hidden;
}
.tile.on { border-color: var(--shu); color: var(--shu); background: var(--shu-soft); font-weight: 700; }
.tile.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.tile:hover { border-color: var(--ink); }
.legend { font-size: 12px; color: var(--ink-soft); display: flex; gap: 14px; justify-content: center; margin: 10px 0 0; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 1px solid var(--line); margin-right: 4px; vertical-align: -1px; }
.legend .l-on::before { border-color: var(--shu); background: var(--shu-soft); }
.prefcard { margin-top: 18px; }
.prefcard h2 { font-size: 18px; margin: 0 0 6px; }
.prefcard .none { font-size: 14px; color: var(--ink-soft); }

.modal-back {
  position: fixed; inset: 0; background: rgba(10, 15, 22, .45);
  display: grid; place-items: center; padding: 16px; z-index: 20;
}
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 20px; max-width: 360px; width: 100%; }
.modal p { margin: 0 0 4px; }

.age {
  position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: var(--ink-soft);
  background: var(--paper); padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; z-index: 10;
}
.note { font-size: 12px; color: var(--ink-soft); margin-top: 28px; }

@media (max-width: 480px) {
  .wrap { padding: 16px 16px 64px; }
  .qbig { font-size: 25px; }
  .tile { font-size: 9px; }
  .map { gap: 2px; }
  .regions { grid-template-columns: repeat(2, 1fr); }
  .info dl { grid-template-columns: 4em 1fr; }
}
</style>
</head>

<script id="quiz-core">
// 問題生成。DOMに触らない。tools/check.js からも読む。
var SakeCore = (function () {
  // [名前, 地方, 列, 行]
  var PREFS = [
    ["北海道", "北海道・東北", 11, 0],
    ["青森県", "北海道・東北", 11, 1],
    ["岩手県", "北海道・東北", 11, 2],
    ["宮城県", "北海道・東北", 11, 3],
    ["秋田県", "北海道・東北", 10, 2],
    ["山形県", "北海道・東北", 10, 3],
    ["福島県", "北海道・東北", 11, 4],
    ["茨城県", "関東", 10, 5],
    ["栃木県", "関東", 10, 4],
    ["群馬県", "関東", 9, 4],
    ["埼玉県", "関東", 9, 5],
    ["千葉県", "関東", 10, 6],
    ["東京都", "関東", 9, 6],
    ["神奈川県", "関東", 8, 6],
    ["新潟県", "中部", 9, 3],
    ["富山県", "中部", 8, 3],
    ["石川県", "中部", 7, 3],
    ["福井県", "中部", 6, 4],
    ["山梨県", "中部", 8, 5],
    ["長野県", "中部", 8, 4],
    ["岐阜県", "中部", 7, 4],
    ["静岡県", "中部", 7, 6],
    ["愛知県", "中部", 7, 5],
    ["三重県", "近畿", 6, 6],
    ["滋賀県", "近畿", 6, 5],
    ["京都府", "近畿", 5, 5],
    ["大阪府", "近畿", 4, 6],
    ["兵庫県", "近畿", 4, 5],
    ["奈良県", "近畿", 5, 6],
    ["和歌山県", "近畿", 5, 7],
    ["鳥取県", "中国・四国", 3, 5],
    ["島根県", "中国・四国", 2, 5],
    ["岡山県", "中国・四国", 3, 6],
    ["広島県", "中国・四国", 2, 6],
    ["山口県", "中国・四国", 1, 6],
    ["徳島県", "中国・四国", 4, 8],
    ["香川県", "中国・四国", 4, 7],
    ["愛媛県", "中国・四国", 3, 7],
    ["高知県", "中国・四国", 3, 8],
    ["福岡県", "九州・沖縄", 1, 7],
    ["佐賀県", "九州・沖縄", 0, 7],
    ["長崎県", "九州・沖縄", 0, 8],
    ["熊本県", "九州・沖縄", 1, 8],
    ["大分県", "九州・沖縄", 2, 7],
    ["宮崎県", "九州・沖縄", 2, 8],
    ["鹿児島県", "九州・沖縄", 1, 9],
    ["沖縄県", "九州・沖縄", 0, 10]
  ];
  // 裏取りの結果、載せられなかった県と理由
  var EXCLUDED = {
    "沖縄県": "県内の清酒蔵について、蔵元公式サイトなどの一次情報で現在の製造状況を確かめられなかったため、載せていない。"
  };
  var REGIONS = ["北海道・東北", "関東", "中部", "近畿", "中国・四国", "九州・沖縄"];
  var regionOf = {};
  PREFS.forEach(function (p) { regionOf[p[0]] = p[1]; });

  var TYPES = ["pref", "brand", "brewery", "city", "older"];
  var TYPE_LABEL = { pref: "産地", brand: "県の酒", brewery: "蔵元", city: "蔵の町", older: "古さ" };

  function shortPref(name) {
    return name === "北海道" ? "北海道" : name.replace(/[都府県]$/, "");
  }

  function makeRng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }
  function shuffle(a, rng) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pickDistinct(cands, n, used, rng) {
    var out = [];
    shuffle(cands, rng).forEach(function (c) {
      if (out.length < n && !used[c.label]) { used[c.label] = true; out.push(c); }
    });
    return out;
  }
  function finish(q, correct, wrongs, rng) {
    if (wrongs.length < q.need - 1) return null;
    var choices = shuffle([correct].concat(wrongs.slice(0, q.need - 1)), rng);
    q.choices = choices;
    q.answer = choices.indexOf(correct);
    delete q.need;
    return q;
  }

  // 1問作る。作れないときは null
  function make(type, item, data, rng) {
    var q = { type: type, kind: TYPE_LABEL[type], item: item, need: 4 };
    var used = {}, correct, cands;

    if (type === "pref") {
      // 銘柄名に県名が入っていると答えが見えてしまう
      if (item.brand.indexOf(shortPref(item.pref)) >= 0) return null;
      q.text = "この銘柄の産地は？";
      q.big = item.brand;
      correct = { label: item.pref };
      used[item.pref] = true;
      var reg = regionOf[item.pref];
      var near = PREFS.filter(function (p) { return p[1] === reg && p[0] !== item.pref; })
        .map(function (p) { return { label: p[0] }; });
      var far = PREFS.filter(function (p) { return p[1] !== reg; })
        .map(function (p) { return { label: p[0] }; });
      var w = pickDistinct(near, 2, used, rng);
      w = w.concat(pickDistinct(far, 3 - w.length, used, rng));
      return finish(q, correct, w, rng);
    }

    if (type === "brand") {
      q.text = "この県の酒はどれ？";
      q.big = item.pref;
      correct = { label: item.brand };
      used[item.brand] = true;
      // 同じ県の銘柄は誤答にしない。同じ名前の銘柄も避ける
      cands = data.filter(function (d) { return d.pref !== item.pref; })
        .map(function (d) { return { label: d.brand }; });
      return finish(q, correct, pickDistinct(cands, 3, used, rng), rng);
    }

    if (type === "brewery") {
      // 蔵元名に銘柄名が入っていると答えが見えてしまう
      if (item.brewery.indexOf(item.brand) >= 0) return null;
      q.text = "この銘柄を造る蔵は？";
      q.big = item.brand;
      q.sub = item.pref;
      correct = { label: item.brewery };
      used[item.brewery] = true;
      cands = data.filter(function (d) { return d.brand !== item.brand; })
        .map(function (d) { return { label: d.brewery }; });
      return finish(q, correct, pickDistinct(cands, 3, used, rng), rng);
    }

    if (type === "city") {
      if (!item.city) return null;
      if (item.brewery.indexOf(shortPref(item.pref)) >= 0) q.subHidden = true;
      q.text = "この蔵があるのは？";
      q.big = item.brand;
      q.sub = q.subHidden ? null : item.brewery;
      delete q.subHidden;
      var lab = function (d) { return d.pref + " " + d.city; };
      correct = { label: lab(item) };
      used[correct.label] = true;
      var withCity = data.filter(function (d) { return d.city && !(d.pref === item.pref && d.city === item.city); });
      var same = withCity.filter(function (d) { return d.pref === item.pref; }).map(function (d) { return { label: lab(d) }; });
      var reg2 = withCity.filter(function (d) { return d.pref !== item.pref && regionOf[d.pref] === regionOf[item.pref]; }).map(function (d) { return { label: lab(d) }; });
      var rest = withCity.filter(function (d) { return regionOf[d.pref] !== regionOf[item.pref]; }).map(function (d) { return { label: lab(d) }; });
      var w2 = pickDistinct(same, 3, used, rng);
      w2 = w2.concat(pickDistinct(reg2, 3 - w2.length, used, rng));
      w2 = w2.concat(pickDistinct(rest, 3 - w2.length, used, rng));
      return finish(q, correct, w2, rng);
    }

    if (type === "older") {
      if (!item.founded) return null;
      var others = shuffle(data.filter(function (d) {
        return d.founded && d.brand !== item.brand && Math.abs(d.founded - item.founded) >= 10;
      }), rng);
      if (!others.length) return null;
      var other = others[0];
      q.need = 2;
      q.text = "創業が古いのはどっち？";
      q.big = null;
      q.pair = [item, other];
      var a = { label: item.brand, sub: item.pref + "・" + item.brewery, ref: item };
      var b = { label: other.brand, sub: other.pref + "・" + other.brewery, ref: other };
      var old = item.founded < other.founded ? a : b;
      q.item = old.ref;
      return finish(q, old, [old === a ? b : a], rng);
    }
    return null;
  }

  // 1回分の問題。pool から最大 n 問。なるべく県を散らす
  function round(data, pool, n, rng) {
    var byPref = {};
    pool.forEach(function (d) { (byPref[d.pref] = byPref[d.pref] || []).push(d); });
    var prefs = shuffle(Object.keys(byPref), rng);
    var picks = [];
    var i = 0;
    while (picks.length < n && prefs.length) {
      var p = prefs[i % prefs.length];
      var list = byPref[p];
      picks.push(list[Math.floor(rng() * list.length)]);
      i++;
      if (i >= prefs.length * 2) break;
    }
    var qs = [];
    picks.forEach(function (item) {
      var types = shuffle(TYPES, rng);
      for (var t = 0; t < types.length; t++) {
        var q = make(types[t], item, data, rng);
        if (q) { qs.push(q); break; }
      }
    });
    return qs;
  }

  return {
    PREFS: PREFS, EXCLUDED: EXCLUDED, REGIONS: REGIONS, regionOf: regionOf, TYPES: TYPES,
    shortPref: shortPref, makeRng: makeRng, shuffle: shuffle, make: make, round: round
  };
})();
if (typeof module !== "undefined") module.exports = SakeCore;
</script>

<script id="quiz-ui">
(function () {
  var DATA = JSON.parse(document.getElementById("sake-data").textContent);
  var C = SakeCore;
  var app = document.getElementById("app");
  var KEY = "sake-techo-v1";
  var ROUND = 10;

  // ---- 保存 ----
  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === "object") {
          return { stamps: s.stamps || {}, best: s.best || 0, plays: s.plays || 0 };
        }
      }
    } catch (e) { /* 保存できない環境 */ }
    return { stamps: {}, best: 0, plays: 0 };
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 何もしない */ }
  }
  var state = load();

  var rng = C.makeRng(Date.now() ^ Math.floor(Math.random() * 1e9));
  var prefsWithData = {};
  DATA.forEach(function (d) { prefsWithData[d.pref] = true; });
  var TOTAL = Object.keys(prefsWithData).length;

  function stampCount() {
    return Object.keys(state.stamps).filter(function (p) { return prefsWithData[p]; }).length;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function host(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; }
  }
  function h(html) { app.innerHTML = html; window.scrollTo(0, 0); }

  function header() {
    return '<header class="top"><h1>酒どころ手帖</h1>' +
      '<span class="count">手帖 ' + stampCount() + ' / ' + TOTAL + '</span></header>';
  }

  // ---- タイトル ----
  var keyHandler = null;
  function setKeys(fn) { keyHandler = fn; }
  document.addEventListener("keydown", function (e) {
    if (keyHandler && !e.ctrlKey && !e.metaKey && !e.altKey) keyHandler(e);
  });

  function title(showRegions) {
    setKeys(null);
    var left = DATA.filter(function (d) { return !state.stamps[d.pref]; }).length;
    var html = header() +
      '<p class="lead">全国の酒蔵を4択でめぐる。正解した県に印が付き、手帖が埋まっていく。1回10問。</p>' +
      '<div class="modes">' +
      '<button class="mode" data-act="all"><b>全国</b><span>47都道府県からランダムに出題</span><i>10問</i></button>' +
      '<button class="mode" data-act="region"><b>地方をえらぶ</b><span>6つの地方から1つ選ぶ</span><i>10問</i></button>' +
      (showRegions ? '<div class="regions">' + C.REGIONS.map(function (r) {
        return '<button data-region="' + esc(r) + '">' + esc(r) + '</button>';
      }).join("") + '</div>' : '') +
      '<button class="mode" data-act="left"' + (left ? '' : ' disabled') + '><b>まだの県</b><span>' +
      (left ? '印が付いていない県だけから出題' : '全県に印が付いた') + '</span><i>' + Math.min(ROUND, left) + '問</i></button>' +
      '<button class="mode" data-act="book"><b>手帖をひらく</b><span>集めた県と銘柄を見る</span><i>' + stampCount() + '県</i></button>' +
      '</div>' +
      (state.plays ? '<p class="note">これまで ' + state.plays + ' 回、最高 ' + state.best + ' / ' + ROUND + '</p>' : '') +
      '<p class="note">収録 ' + DATA.length + ' 銘柄。銘柄・蔵元・所在地は蔵元の公式サイトなどで確認したもの（確認日は sources.md）。</p>';
    h(html);
    app.querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.getAttribute("data-act");
        if (a === "all") start(DATA, "全国");
        else if (a === "region") title(!showRegions);
        else if (a === "left") start(DATA.filter(function (d) { return !state.stamps[d.pref]; }), "まだの県");
        else if (a === "book") book(null);
      });
    });
    app.querySelectorAll("[data-region]").forEach(function (b) {
      b.addEventListener("click", function () {
        var r = b.getAttribute("data-region");
        start(DATA.filter(function (d) { return C.regionOf[d.pref] === r; }), r);
      });
    });
  }

  // ---- 出題 ----
  var run = null;
  function start(pool, label) {
    if (!pool.length) { title(false); return; }
    var qs = C.round(DATA, pool, ROUND, rng);
    run = { qs: qs, i: 0, marks: [], label: label, newStamps: [] };
    ask();
  }

  function pips() {
    return '<div class="pips">' + run.qs.map(function (_, i) {
      var c = i < run.marks.length ? (run.marks[i] ? "ok" : "ng") : (i === run.i ? "now" : "");
      return '<span class="pip ' + c + '"></span>';
    }).join("") + '</div>';
  }

  function choiceHtml(c, i) {
    return '<button class="choice" data-i="' + i + '"><span class="k">' + (i + 1) + '</span>' +
      '<span class="t">' + esc(c.label) + (c.sub ? '<small>' + esc(c.sub) + '</small>' : '') + '</span></button>';
  }

  function ask() {
    var q = run.qs[run.i];
    var html = header() +
      '<div class="qhead"><span>' + esc(run.label) + '　' + (run.i + 1) + ' / ' + run.qs.length + '</span>' + pips() + '</div>' +
      '<div class="qcard">' +
      '<div class="qkind">' + esc(q.kind) + '</div>' +
      '<p class="qtext">' + esc(q.text) + '</p>' +
      (q.big ? '<div class="qbig mincho">' + esc(q.big) + '</div>' : '') +
      (q.sub ? '<p class="qsub">' + esc(q.sub) + '</p>' : '') +
      '<div class="choices">' + q.choices.map(choiceHtml).join("") + '</div>' +
      '<div id="after"></div>' +
      '</div>' +
      '<p class="hint">キーボードの 1〜' + q.choices.length + ' でも答えられる</p>';
    h(html);
    app.querySelectorAll(".choice").forEach(function (b) {
      b.addEventListener("click", function () { answer(+b.getAttribute("data-i")); });
    });
    setKeys(function (e) {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.choices.length) answer(n - 1);
    });
  }

  function infoHtml(d) {
    var rows = '<dt>蔵元</dt><dd>' + esc(d.brewery) + '</dd>' +
      '<dt>所在地</dt><dd>' + esc(d.pref) + (d.city ? ' ' + esc(d.city) : '') + '</dd>' +
      (d.founded ? '<dt>創業</dt><dd>' + esc(d.founded) + '年' + (d.founded_note ? '（' + esc(d.founded_note) + '）' : '') + '</dd>' : '') +
      (d.feature ? '<dt>メモ</dt><dd>' + esc(d.feature) + '</dd>' : '');
    var seenHost = {};
    var src = (d.urls || []).filter(function (u) {
      var k = host(u);
      if (seenHost[k]) return false;
      seenHost[k] = true;
      return true;
    }).map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(host(u)) + '</a>';
    }).join("、");
    return '<div class="info"><h3 class="mincho">' + esc(d.brand) + '</h3>' +
      (d.brand_kana ? '<div class="kana">' + esc(d.brand_kana) + '</div>' : '') +
      '<dl>' + rows + '</dl>' +
      (src ? '<p class="src">出典：' + src + '</p>' : '') + '</div>';
  }

  function answer(i) {
    var q = run.qs[run.i];
    if (run.marks.length > run.i) return;
    var ok = i === q.answer;
    run.marks.push(ok);
    if (ok && !state.stamps[q.item.pref]) {
      state.stamps[q.item.pref] = true;
      run.newStamps.push(q.item.pref);
      save();
    }
    app.querySelectorAll(".choice").forEach(function (b, j) {
      b.disabled = true;
      if (j === q.answer) b.classList.add("correct");
      else if (j === i) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    var items = q.pair ? q.pair : [q.item];
    var last = run.i === run.qs.length - 1;
    document.getElementById("after").innerHTML =
      '<div class="verdict">' +
      (ok ? '<div class="stamp">正解</div><p>' + esc(C.shortPref(q.item.pref)) + 'に印。</p>'
          : '<div class="stamp miss">惜しい</div><p>正解は ' + (q.answer + 1) + '。</p>') +
      '</div>' +
      items.map(infoHtml).join("") +
      '<div class="actions"><button class="btn" id="next">' + (last ? '結果を見る' : '次へ') + '</button></div>' +
      '<p class="hint">Enter で次へ</p>';
    var next = document.getElementById("next");
    next.addEventListener("click", advance);
    next.focus({ preventScroll: true });
    setKeys(function (e) { if (e.key === "Enter") { e.preventDefault(); advance(); } });
  }

  function advance() {
    run.i++;
    if (run.i < run.qs.length) ask(); else result();
  }

  function result() {
    setKeys(null);
    var score = run.marks.filter(Boolean).length;
    state.plays++;
    if (score > state.best) state.best = score;
    save();
    var html = header() +
      '<div class="qcard">' +
      '<div class="qkind">' + esc(run.label) + ' の結果</div>' +
      '<div class="score mincho">' + score + ' <small>/ ' + run.qs.length + '</small></div>' +
      (run.newStamps.length
        ? '<p class="qsub">新しく印が付いた県</p><div class="newstamps">' + run.newStamps.map(function (p) {
            return '<span>' + esc(p) + '</span>';
          }).join("") + '</div>'
        : '<p class="qsub">今回は新しい印なし。</p>') +
      '<p class="qsub" style="margin-top:12px">手帖 ' + stampCount() + ' / ' + TOTAL + '</p>' +
      '<div class="actions"><button class="btn" id="again">もう1回</button>' +
      '<button class="btn ghost" id="tobook">手帖</button>' +
      '<button class="btn ghost" id="totop">はじめに戻る</button></div>' +
      '</div>';
    h(html);
    var label = run.label;
    document.getElementById("again").addEventListener("click", function () {
      if (label === "全国") start(DATA, label);
      else if (label === "まだの県") start(DATA.filter(function (d) { return !state.stamps[d.pref]; }), label);
      else start(DATA.filter(function (d) { return C.regionOf[d.pref] === label; }), label);
    });
    document.getElementById("tobook").addEventListener("click", function () { book(null); });
    document.getElementById("totop").addEventListener("click", function () { title(false); });
  }

  // ---- 手帖 ----
  function book(sel) {
    setKeys(null);
    var maxRow = 0;
    C.PREFS.forEach(function (p) { if (p[3] > maxRow) maxRow = p[3]; });
    var tiles = C.PREFS.map(function (p) {
      var on = state.stamps[p[0]] && prefsWithData[p[0]];
      return '<button class="tile' + (on ? ' on' : '') + (sel === p[0] ? ' sel' : '') + '" data-pref="' + esc(p[0]) +
        '" style="grid-column:' + (p[2] + 1) + ';grid-row:' + (p[3] + 1) + '" aria-label="' + esc(p[0]) + (on ? ' 印あり' : '') + '">' +
        esc(C.shortPref(p[0])) + '</button>';
    }).join("");
    var card = "";
    if (sel) {
      var list = DATA.filter(function (d) { return d.pref === sel; });
      card = '<div class="prefcard"><h2>' + esc(sel) + '</h2>' +
        (!list.length ? '<p class="none">この県は収録なし。' + esc(C.EXCLUDED[sel] || "") + '</p>'
          : state.stamps[sel] ? list.map(infoHtml).join("")
          : '<p class="none">まだ印がない。この県の問題に正解すると、ここに銘柄が載る（収録 ' + list.length + ' 銘柄）。</p>') +
        '</div>';
    }
    var html = header() +
      '<div class="map" style="grid-template-rows:repeat(' + (maxRow + 1) + ',auto)">' + tiles + '</div>' +
      '<div class="legend"><span class="l-on">印あり</span><span>まだ</span></div>' +
      (card || '<p class="lead" style="margin-top:16px;text-align:center">県をえらぶと、集めた銘柄が見られる。</p>') +
      '<div class="actions"><button class="btn" id="totop">はじめに戻る</button>' +
      '<button class="btn ghost" id="reset">手帖を白紙に戻す</button></div>';
    h(html);
    app.querySelectorAll(".tile").forEach(function (b) {
      b.addEventListener("click", function () {
        book(b.getAttribute("data-pref"));
        var c = app.querySelector(".prefcard");
        if (c) c.scrollIntoView({ block: "nearest" });
      });
    });
    document.getElementById("totop").addEventListener("click", function () { title(false); });
    document.getElementById("reset").addEventListener("click", confirmReset);
  }

  function confirmReset() {
    var back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<p><b>手帖を白紙に戻す？</b></p><p class="qsub">集めた印と記録が消える。元には戻せない。</p>' +
      '<div class="actions"><button class="btn" id="doReset">白紙に戻す</button>' +
      '<button class="btn ghost" id="noReset">やめる</button></div></div>';
    document.body.appendChild(back);
    var close = function () { back.remove(); setKeys(null); };
    back.querySelector("#noReset").addEventListener("click", close);
    back.addEventListener("click", function (e) { if (e.target === back) close(); });
    back.querySelector("#doReset").addEventListener("click", function () {
      state = { stamps: {}, best: 0, plays: 0 };
      save();
      close();
      book(null);
    });
    back.querySelector("#noReset").focus();
    setKeys(function (e) { if (e.key === "Escape") close(); });
  }

  title(false);
})();
</script>
</body>
</html>
