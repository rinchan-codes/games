<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>武器ガチャ｜ハンター武器縛りルーレット</title>
<meta name="description" content="アイスボーンの武器縛り用。14武器種からランダムに使用武器を決める演出付きガチャ。">
<meta name="theme-color" content="#070b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0d1424; --panel:rgba(18,26,44,.72); --line:rgba(140,190,255,.16);
  --ink:#e8f1ff; --mute:#8fa3c4; --ice:#8fdcff; --ice2:#3a9bdc;
  --gold:#ffd36b; --gold2:#ff9f2e; --purple:#c58bff; --blue:#5fb8ff;
  --danger:#ff6b6b;
  --r3:#5fb8ff; --r4:#c58bff; --r5:#ffd36b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#16274a 0%,transparent 60%),
             radial-gradient(900px 600px at 50% 120%,#1a1030 0%,transparent 60%),var(--bg);
  color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 16px 80px}

/* ---------- header ---------- */
header{text-align:center;padding:12px 0 8px}
.eyebrow{font-family:Cinzel,serif;letter-spacing:.5em;font-size:11px;color:var(--ice);opacity:.8}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(40px,8vw,72px);line-height:1.05;
  margin-top:6px;letter-spacing:.08em;
  background:linear-gradient(180deg,#fff 0%,#cfe9ff 45%,#6fb6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(110,190,255,.35))}
h1 small{display:block;font-family:Cinzel,serif;font-size:.22em;letter-spacing:.6em;color:var(--gold);-webkit-text-fill-color:var(--gold);margin-top:8px}
.sub{color:var(--mute);font-size:13px;margin-top:10px}

/* ---------- altar ---------- */
.altar{position:relative;margin:26px auto 10px;width:min(360px,80vw);aspect-ratio:1;display:grid;place-items:center}
.altar svg.crest{width:100%;height:100%;overflow:visible}
.ring{transform-origin:50% 50%;transform-box:fill-box}
.spin1{animation:spin 40s linear infinite}
.spin2{animation:spin 26s linear infinite reverse}
.spin3{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.drawbtn{position:absolute;inset:27%;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 35%,#2a5fa8 0%,#10264a 55%,#081325 100%);
  box-shadow:0 0 0 2px rgba(150,210,255,.45),0 0 0 8px rgba(80,150,255,.08),0 0 60px rgba(80,170,255,.45),inset 0 -12px 30px rgba(0,0,0,.5),inset 0 8px 20px rgba(160,220,255,.25);
  transition:transform .2s,box-shadow .2s}
.drawbtn:hover{transform:scale(1.04);box-shadow:0 0 0 2px rgba(200,235,255,.8),0 0 0 10px rgba(80,150,255,.12),0 0 90px rgba(90,180,255,.7),inset 0 -12px 30px rgba(0,0,0,.5),inset 0 8px 20px rgba(160,220,255,.35)}
.drawbtn:active{transform:scale(.97)}
.drawbtn b{display:block;font-family:"Shippori Mincho B1",serif;font-size:clamp(20px,5vw,28px);letter-spacing:.15em;text-shadow:0 0 12px rgba(150,220,255,.8)}
.drawbtn span{font-family:Cinzel,serif;font-size:10px;letter-spacing:.35em;color:var(--ice)}
.drawbtn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:8px 0 18px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
.seg button{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--mute);transition:.2s}
.seg button.on{background:linear-gradient(180deg,#3d7fd0,#1f4f92);color:#fff;box-shadow:0 0 16px rgba(80,160,255,.5)}
.seg .lbl{padding:8px 6px 8px 12px;font-size:12px;color:var(--mute);align-self:center}
.poolinfo{font-size:12px;color:var(--mute)}
.poolinfo b{color:var(--ice);font-size:14px}

/* ---------- last result ---------- */
.last{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:10px;margin-bottom:20px}
.last .chip{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.last .chip svg{width:40px;height:40px}
.last .chip .p{font-family:Cinzel,serif;font-size:10px;color:var(--mute);letter-spacing:.2em}
.last .chip .n{font-weight:900;font-size:16px}
.last .chip .c{font-size:11px;color:var(--gold)}
.last .chip.r4{border-color:rgba(197,139,255,.5)} .last .chip.r5{border-color:rgba(255,211,107,.6);box-shadow:0 0 20px rgba(255,200,90,.2)}
.actions{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.actions[hidden]{display:none}
.btn{padding:10px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;transition:.2s}
.btn:hover{border-color:rgba(150,210,255,.5);background:rgba(30,45,75,.8)}
.btn.primary{background:linear-gradient(180deg,#3d7fd0,#1f4f92);border-color:transparent}

/* ---------- panels ---------- */
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:-1px;position:relative;z-index:2}
.tabs button{padding:12px 20px;border-radius:14px 14px 0 0;color:var(--mute);border:1px solid transparent;border-bottom:0;font-weight:700;font-size:14px}
.tabs button.on{color:var(--ink);background:var(--panel);border-color:var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;backdrop-filter:blur(10px)}
.panel[hidden]{display:none}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.phead h3{font-size:15px;letter-spacing:.1em}
.phead .mini{display:flex;gap:6px}
.mini button{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.mini button:hover{color:var(--ink);border-color:rgba(150,210,255,.5)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wtile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(40,70,120,.35),rgba(15,25,45,.35));border:1px solid rgba(140,190,255,.22);transition:.2s;text-align:center}
.wtile svg{width:52px;height:52px;transition:.2s}
.wtile .nm{font-weight:700;font-size:14px}
.wtile .en{font-family:Cinzel,serif;font-size:9px;letter-spacing:.15em;color:var(--mute)}
.wtile .cnt{position:absolute;top:6px;right:8px;font-size:10px;color:var(--mute)}
.wtile:hover{border-color:rgba(150,210,255,.6);transform:translateY(-2px)}
.wtile.off{opacity:.35;filter:grayscale(1);background:rgba(10,14,24,.4)}
.wtile.off::after{content:"除外";position:absolute;top:6px;left:8px;font-size:10px;color:var(--danger);font-weight:700}

.hist{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(10,16,30,.5);border:1px solid var(--line)}
.hrow .no{font-family:Cinzel,serif;color:var(--mute);font-size:11px;min-width:34px}
.hrow .items{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.hrow .it{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(255,255,255,.04)}
.hrow .it svg{width:24px;height:24px}
.hrow .it.r4{box-shadow:inset 0 0 0 1px rgba(197,139,255,.5)} .hrow .it.r5{box-shadow:inset 0 0 0 1px rgba(255,211,107,.7)}
.hrow .tm{font-size:11px;color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:30px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;margin-bottom:18px}
.srow{display:grid;grid-template-columns:22px 92px 1fr 28px;align-items:center;gap:8px;font-size:12px}
.srow svg{width:22px;height:22px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ice2),var(--ice));border-radius:9px}
.srow .v{text-align:right;color:var(--mute)}

.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.opt:last-child{border:0}
.opt .t{font-weight:700;font-size:14px}
.opt .d{font-size:12px;color:var(--mute);margin-top:2px}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:99px;background:rgba(255,255,255,.1);transition:.2s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#9fb3d1;transition:.2s}
.sw.on{background:linear-gradient(90deg,#2f6fc0,#58b4ff)}
.sw.on::after{left:23px;background:#fff;box-shadow:0 0 10px rgba(150,220,255,.9)}
.rates{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.rates span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid}
footer{text-align:center;color:var(--mute);font-size:11px;margin-top:36px;line-height:1.8;opacity:.8}

/* ---------- overlay ---------- */
#ov{position:fixed;inset:0;z-index:50;display:none;background:radial-gradient(circle at 50% 50%,rgba(10,20,40,.85),rgba(2,4,10,.97));overflow:hidden}
#ov.show{display:block}
#fx{position:absolute;inset:0;width:100%;height:100%}
.charge{position:absolute;left:50%;top:50%;width:min(70vmin,460px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .3s}
.charge svg{width:100%;height:100%;overflow:visible}
.charge .core{transition:fill .25s}
.ov-hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);letter-spacing:.2em;animation:pulse 1.6s infinite}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
.rank-call{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:Cinzel,serif;font-weight:800;letter-spacing:.5em;font-size:clamp(16px,3.5vw,26px);opacity:0;pointer-events:none}
.rank-call.go{animation:call 1.1s ease-out forwards}
@keyframes call{0%{opacity:0;transform:scale(1.6);letter-spacing:1em}30%{opacity:1;transform:scale(1);letter-spacing:.5em}80%{opacity:1}100%{opacity:0}}

.cards{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,24px);padding:80px 16px 120px;flex-wrap:wrap;perspective:1400px;pointer-events:none}
.card{--c:var(--r3);width:clamp(140px,22vw,230px);aspect-ratio:5/7.6;position:relative;transform-style:preserve-3d;
  transform:translateY(60px) rotateY(180deg) scale(.6);opacity:0;transition:transform .8s cubic-bezier(.2,1.3,.4,1),opacity .4s;pointer-events:auto;cursor:pointer}
.cards.n3 .card,.cards.n4 .card{width:clamp(130px,20vw,200px)}
.card.in{opacity:1;transform:translateY(0) rotateY(180deg) scale(1)}
.card.flip{transform:translateY(0) rotateY(0) scale(1)}
.card.r4{--c:var(--r4)} .card.r5{--c:var(--r5)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{transform:rotateY(180deg);background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px),
  radial-gradient(circle at 50% 50%,#1d3a66,#0a1528);border:2px solid rgba(150,200,255,.4);display:grid;place-items:center;box-shadow:0 0 30px rgba(60,140,255,.3)}
.back svg{width:60%;opacity:.8}
.card.r4 .back{box-shadow:0 0 40px rgba(197,139,255,.6);border-color:rgba(197,139,255,.7)}
.card.r5 .back{box-shadow:0 0 50px rgba(255,211,107,.8);border-color:rgba(255,211,107,.9);animation:goldback 1s infinite}
@keyframes goldback{50%{box-shadow:0 0 80px rgba(255,190,80,1)}}
.front{background:
  radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 45%,transparent) 0%,transparent 55%),
  linear-gradient(180deg,#152643 0%,#0b1426 100%);
  border:2px solid var(--c);box-shadow:0 0 40px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 20%,transparent);
  display:flex;flex-direction:column;align-items:center;padding:14px 10px}
.front::before{content:"";position:absolute;inset:6px;border-radius:11px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);pointer-events:none}
.front::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%);pointer-events:none}
.card.flip .front::after{animation:shine 1.4s .5s ease-out}
.card.r5.flip .front::after{animation:shine 2.2s .5s ease-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
.front .pl{font-family:Cinzel,serif;font-size:11px;letter-spacing:.3em;color:var(--mute);margin-top:4px}
.front .stars{color:var(--c);font-size:clamp(13px,2vw,17px);letter-spacing:2px;margin-top:6px;text-shadow:0 0 8px var(--c)}
.front .ico{flex:1;display:grid;place-items:center;width:100%}
.front .ico svg{width:72%;max-height:100%;filter:drop-shadow(0 0 12px var(--c))}
.front .wn{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(20px,3.2vw,30px);letter-spacing:.05em;text-shadow:0 0 14px var(--c);text-align:center;line-height:1.15}
.front .we{font-family:Cinzel,serif;font-size:clamp(8px,1.1vw,10px);letter-spacing:.25em;color:var(--c);margin:4px 0 2px}
.front .ch{font-size:11px;color:var(--gold);margin-top:6px;padding:4px 8px;border:1px dashed rgba(255,211,107,.5);border-radius:8px;text-align:center}
.front .rk{position:absolute;top:10px;right:12px;font-family:Cinzel,serif;font-weight:800;font-size:12px;color:var(--c)}
.ov-actions{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:12px;opacity:0;transform:translateY(20px);transition:.4s;pointer-events:none}
.ov-actions.show{opacity:1;transform:none;pointer-events:auto}
.ov-actions .btn{padding:14px 26px;font-size:15px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:#1b2a48;border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:13px;z-index:99;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .tabs button{padding:10px 12px;font-size:13px}
  .panel{padding:14px}
  .grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .wtile{padding:10px 4px}
  .wtile svg{width:40px;height:40px}
  .wtile .nm{font-size:12px}
  .wtile .en{display:none}
  .cards{padding:60px 12px 110px;gap:10px}
  .cards.n2 .card,.cards.n3 .card,.cards.n4 .card{width:42vw}
  .cards.n3 .card .wn,.cards.n4 .card .wn{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.spin1,.spin2,.spin3,.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <header>
    <div class="eyebrow">HUNTER'S WEAPON ROULETTE</div>
    <h1>武器ガチャ<small>FOR ICEBORNE CHALLENGE</small></h1>
    <p class="sub">14武器種から、次の狩りで使う武器を運命に委ねよう。</p>
  </header>

  <div class="altar">
    <svg class="crest" viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#5fb8ff" stop-opacity=".35"/><stop offset="1" stop-color="#5fb8ff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="200" fill="url(#glow)" class="pulse"/>
      <g class="ring spin1" fill="none" stroke="#8fdcff" stroke-opacity=".35">
        <circle cx="200" cy="200" r="186" stroke-dasharray="2 6"/>
        <circle cx="200" cy="200" r="176"/>
      </g>
      <g class="ring spin2" id="runes" fill="#8fdcff" fill-opacity=".55" font-family="Cinzel" font-size="13" text-anchor="middle"></g>
      <g class="ring spin3" fill="none" stroke="#ffd36b" stroke-opacity=".5">
        <circle cx="200" cy="200" r="140" stroke-dasharray="40 14"/>
        <path id="tick" d=""/>
      </g>
      <g id="orbitIcons"></g>
    </svg>
    <button class="drawbtn" id="drawBtn" aria-label="ガチャを引く"><div><b>運命を引く</b><span>SUMMON</span></div></button>
  </div>

  <div class="controls">
    <div class="seg" id="players"><span class="lbl">人数</span>
      <button data-n="1">1人</button><button data-n="2">2人</button><button data-n="3">3人</button><button data-n="4">4人</button>
    </div>
    <div class="poolinfo">抽選対象 <b id="poolCount">14</b> / 14 武器</div>
  </div>

  <div class="last" id="last"></div>
  <div class="actions" id="lastActions" hidden>
    <button class="btn" id="copyBtn">結果をコピー</button>
    <button class="btn" id="excludeLast">今回の武器を除外する</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="on" data-tab="pool">武器プール</button>
    <button data-tab="hist">履歴</button>
    <button data-tab="set">設定</button>
  </div>
  <section class="panel" id="tab-pool">
    <div class="phead"><h3>タップで除外 / 復帰</h3>
      <div class="mini"><button id="allOn">すべて選択</button><button id="allOff">すべて除外</button><button id="melee">近接のみ</button><button id="ranged">遠距離のみ</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="panel" id="tab-hist" hidden>
    <div class="phead"><h3>使用回数</h3><div class="mini"><button id="clearHist">履歴を消去</button></div></div>
    <div class="stats" id="stats"></div>
    <div class="phead"><h3>これまでの結果</h3></div>
    <div class="hist" id="hist"></div>
  </section>
  <section class="panel" id="tab-set" hidden>
    <div class="opts" id="opts"></div>
    <div style="margin-top:14px;font-size:12px;color:var(--mute)">レアリティ排出率（演出用・武器の抽選確率はすべて均等）</div>
    <div class="rates">
      <span style="color:var(--r3);border-color:var(--r3)">★3 蒼 70%</span>
      <span style="color:var(--r4);border-color:var(--r4)">★4 紫 24%</span>
      <span style="color:var(--r5);border-color:var(--r5)">★5 金 6%</span>
    </div>
  </section>

  <footer>
    非公式のファンメイドツールです。ゲーム内の画像・音声は使用していません（アイコン・効果音はすべてオリジナル）。<br>
    設定と履歴はこのブラウザ内にのみ保存されます。
  </footer>
</div>

<div id="ov" aria-live="polite">
  <canvas id="fx"></canvas>
  <div class="charge" id="charge">
    <svg viewBox="0 0 400 400">
      <g id="chRings" fill="none" stroke-width="2"></g>
      <circle class="core" id="core" cx="200" cy="200" r="34"/>
    </svg>
  </div>
  <div class="rank-call" id="rankCall"></div>
  <div class="cards" id="cards"></div>
  <div class="flash" id="flash"></div>
  <div class="ov-hint" id="ovHint">TAP TO SKIP</div>
  <div class="ov-actions" id="ovActions">
    <button class="btn" id="closeOv">閉じる</button>
    <button class="btn primary" id="againOv">もう一回</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";
/* ================= weapon data & original icons ================= */

/* ================= audio (synth, original) ================= */
let AC=null;
function ac(){if(!st.settings.sound)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.2,{type='sine',vol=.15,at=0,slide=0}={}){const a=ac();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d=.4,vol=.2,at=0){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1800;s.buffer=b;g.gain.value=vol;s.connect(fl).connect(g).connect(a.destination);s.start(a.currentTime+at)}
const SFX={
 charge:()=>{tone(110,1.6,{type:'sawtooth',vol:.05,slide:440});tone(220,1.6,{type:'triangle',vol:.06,slide:880})},
 up:(r)=>{const base=r===5?523:392;[0,4,7,12].forEach((s,i)=>tone(base*Math.pow(2,s/12),.35,{type:'triangle',vol:.12,at:i*.06}))},
 burst:()=>{noise(.6,.25);tone(80,.5,{type:'sine',vol:.3,slide:40})},
 flip:(r)=>{tone(r===5?1046:r===4?880:660,.25,{type:'triangle',vol:.1});tone(r===5?1568:1320,.4,{type:'sine',vol:.05,at:.05})},
 fanfare:()=>{[[523,0],[659,.12],[784,.24],[1046,.36],[784,.6],[1046,.72]].forEach(([f,t])=>{tone(f,.5,{type:'square',vol:.04,at:t});tone(f/2,.5,{type:'triangle',vol:.08,at:t})})},
 click:()=>tone(880,.06,{type:'square',vol:.03}),
};

/* ================= background particles ================= */
const bg=$('#bg'),bx=bg.getContext('2d');let bp=[];
function bgResize(){bg.width=innerWidth*devicePixelRatio;bg.height=innerHeight*devicePixelRatio;bp=Array.from({length:Math.min(90,innerWidth/12|0)},()=>mkP(true))}
function mkP(init){return{x:rnd()*bg.width,y:init?rnd()*bg.height:bg.height+10,r:(rnd()*1.8+.4)*devicePixelRatio,v:(rnd()*.4+.15)*devicePixelRatio,w:rnd()*6.28,ice:rnd()<.7}}
function bgLoop(){bx.clearRect(0,0,bg.width,bg.height);for(const p of bp){p.y-=p.v;p.w+=.01;p.x+=Math.sin(p.w)*.3;if(p.y<-10)Object.assign(p,mkP(false));bx.beginPath();bx.fillStyle=p.ice?'rgba(160,220,255,.55)':'rgba(255,180,90,.55)';bx.shadowBlur=8;bx.shadowColor=bx.fillStyle;bx.arc(p.x,p.y,p.r,0,6.28);bx.fill()}requestAnimationFrame(bgLoop)}
addEventListener('resize',bgResize);bgResize();bgLoop();

/* ================= draw logic ================= */
function rollRarity(){const x=rnd();return x<.06?5:x<.30?4:3}
function makeResult(){
 const p=pool();if(!p.length)return null;
 const n=st.players;let avail=[...p];
 const last=st.history[0];
 if(st.settings.noRepeat&&last){const f=avail.filter(w=>!last.items.some(it=>it.id===w.id));if(f.length>=(st.settings.unique?n:1))avail=f}
 const items=[];
 for(let i=0;i<n;i++){
  let src=avail.length?avail:p;
  const w=pick(src);
  if(st.settings.unique)avail=avail.filter(x=>x!==w);
  const r=rollRarity();
  items.push({id:w.id,r,c:(r===5&&st.settings.challenge)?pick(CHALLENGES):null});
 }
 return{t:Date.now(),items};
}

/* ================= overlay animation ================= */
const ov=$('#ov'),fx=$('#fx'),fc=fx.getContext('2d');
let phase='idle',timers=[],parts=[],fxColor='#5fb8ff',fxRun=false,cur=null;
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function clearT(){timers.forEach(clearTimeout);timers=[]}
function fxResize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}
addEventListener('resize',fxResize);fxResize();
function spawnInward(k){const cx=fx.width/2,cy=fx.height/2,R=Math.max(fx.width,fx.height)*.6;for(let i=0;i<k;i++){const a=rnd()*6.28,d=R*(.6+rnd()*.4);parts.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,tx:cx,ty:cy,mode:'in',s:(rnd()*2+1)*devicePixelRatio,life:1,sp:.02+rnd()*.03})}}
function spawnBurst(k,color,speed=1){const cx=fx.width/2,cy=fx.height/2;for(let i=0;i<k;i++){const a=rnd()*6.28,v=(rnd()*14+4)*devicePixelRatio*speed;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,mode:'out',s:(rnd()*3+1)*devicePixelRatio,life:1,c:color})}}
function spawnRain(k,color){for(let i=0;i<k;i++)parts.push({x:rnd()*fx.width,y:-20-rnd()*fx.height*.5,vx:(rnd()-.5)*2,vy:(rnd()*3+2)*devicePixelRatio,mode:'rain',s:(rnd()*3+2)*devicePixelRatio,life:1,c:color,rot:rnd()*6})}
function fxLoop(){
 if(!fxRun)return;
 fc.globalCompositeOperation='source-over';fc.fillStyle='rgba(2,5,12,.28)';fc.fillRect(0,0,fx.width,fx.height);
 fc.globalCompositeOperation='lighter';
 for(const p of parts){
  if(p.mode==='in'){p.x+=(p.tx-p.x)*p.sp*2.2;p.y+=(p.ty-p.y)*p.sp*2.2;if(Math.hypot(p.tx-p.x,p.ty-p.y)<8)p.life=0}
  else if(p.mode==='out'){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life-=.014}
  else{p.x+=p.vx;p.y+=p.vy;p.rot+=.1;p.life-=.003;if(p.y>fx.height+20)p.life=0}
  fc.fillStyle=p.c||fxColor;fc.globalAlpha=Math.max(0,p.life);fc.beginPath();
  if(p.mode==='rain'){fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillRect(-p.s,-p.s/2,p.s*2,p.s);fc.restore()}
  else{fc.arc(p.x,p.y,p.s,0,6.28);fc.fill()}
 }
 fc.globalAlpha=1;parts=parts.filter(p=>p.life>0);
 requestAnimationFrame(fxLoop);
}
function setCharge(r){
 fxColor=RARITY[r].c;
 const core=$('#core');core.setAttribute('fill',fxColor);core.style.filter=`drop-shadow(0 0 30px ${fxColor}) drop-shadow(0 0 60px ${fxColor})`;
 $('#chRings').setAttribute('stroke',fxColor);
}
function buildRings(){
 let s='';for(let i=0;i<5;i++){const r=60+i*28;s+=`<circle cx="200" cy="200" r="${r}" stroke-dasharray="${8+i*6} ${10+i*4}" stroke-opacity="${.9-i*.15}"><animateTransform attributeName="transform" type="rotate" from="0 200 200" to="${i%2?-360:360} 200 200" dur="${2.4-i*.3}s" repeatCount="indefinite"/></circle>`}
 s+=`<g stroke-width="3">${Array.from({length:12},(_,i)=>{const a=i/12*Math.PI*2;return`<line x1="${200+Math.cos(a)*190}" y1="${200+Math.sin(a)*190}" x2="${200+Math.cos(a)*176}" y2="${200+Math.sin(a)*176}"/>`}).join('')}</g>`;
 $('#chRings').innerHTML=s;
}
function draw(){
 if(phase==='charge')return;
 const res=makeResult();
 if(!res){toast('抽選対象の武器がありません');return}
 cur=res;st.history.unshift(res);if(st.history.length>300)st.history.length=300;save();
 clearT();parts=[];
 ov.classList.add('show');document.body.style.overflow='hidden';
 if(!fxRun){fxRun=true;fxResize();fxLoop()}
 $('#cards').innerHTML='';$('#cards').className='cards n'+res.items.length;
 $('#ovActions').classList.remove('show');$('#ovHint').style.display='';
 const maxR=Math.max(...res.items.map(i=>i.r));
 if(st.settings.skip){phase='charge';reveal(true);return}
 phase='charge';
 const ch=$('#charge');ch.style.opacity=1;ch.style.transform='translate(-50%,-50%) scale(.6)';
 buildRings();setCharge(3);
 requestAnimationFrame(()=>{ch.style.transition='transform 2.2s cubic-bezier(.3,0,.2,1),opacity .3s';ch.style.transform='translate(-50%,-50%) scale(1)'});
 SFX.charge();
 const iv=setInterval(()=>spawnInward(6),40);timers.push(iv);
 if(maxR>=4)later(()=>{setCharge(4);SFX.up(4);shake();callout(4)},900);
 if(maxR>=5)later(()=>{setCharge(5);SFX.up(5);shake();callout(5)},1650);
 later(()=>reveal(false),maxR===5?2500:maxR===4?1900:1500);
}
function shake(){ov.classList.remove('shake');void ov.offsetWidth;ov.classList.add('shake')}
function callout(r){const c=$('#rankCall');c.textContent=RARITY[r].call;c.style.color=RARITY[r].c;c.style.textShadow=`0 0 20px ${RARITY[r].c}`;c.classList.remove('go');void c.offsetWidth;c.classList.add('go')}
function reveal(fast){
 timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];
 phase='reveal';
 const res=cur,maxR=Math.max(...res.items.map(i=>i.r));
 const ch=$('#charge');ch.style.transition='opacity .25s';ch.style.opacity=0;
 setCharge(maxR);
 const fl=$('#flash');fl.style.background=maxR===5?'#fff6d8':'#fff';fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
 SFX.burst();spawnBurst(maxR===5?260:maxR===4?180:120,RARITY[maxR].c,maxR===5?1.3:1);
 if(maxR===5){spawnRain(120,'#ffd36b');later(SFX.fanfare,300)}
 const box=$('#cards');
 box.innerHTML=res.items.map((it,i)=>{const w=W[it.id];return`<div class="card r${it.r}" data-i="${i}">
   <div class="face back">${backCrest()}</div>
   <div class="face front"><span class="rk">★${it.r}</span><div class="pl">${pl(i,res.items.length)}</div><div class="stars">${'★'.repeat(it.r)}</div>
   <div class="ico" style="color:#fff">${icon(w)}</div><div class="wn">${w.name}</div><div class="we">${w.en}</div>${it.c?`<div class="ch">追加縛り：${it.c}</div>`:''}</div></div>`}).join('');
 const cards=[...box.children];
 const step=fast?60:160;
 cards.forEach((c,i)=>later(()=>c.classList.add('in'),80+i*step));
 const flipStart=fast?250:700+cards.length*step;
 cards.forEach((c,i)=>{
  const it=res.items[i];
  const delay=flipStart+i*(fast?120:(it.r===5?650:420));
  later(()=>flipCard(c,it),delay);
  c.addEventListener('click',e=>{e.stopPropagation();flipCard(c,it)});
 });
 const end=flipStart+res.items.reduce((a,it)=>a+(fast?120:(it.r===5?650:420)),0)+300;
 later(finish,end);
 renderAll();
}
function flipCard(c,it){if(c.classList.contains('flip'))return;c.classList.add('in','flip');SFX.flip(it.r);if(it.r>=4){const rect=c.getBoundingClientRect();const cx=(rect.left+rect.width/2)*devicePixelRatio,cy=(rect.top+rect.height/2)*devicePixelRatio;for(let i=0;i<(it.r===5?90:50);i++){const a=rnd()*6.28,v=(rnd()*8+2)*devicePixelRatio;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,mode:'out',s:(rnd()*2.5+1)*devicePixelRatio,life:1,c:RARITY[it.r].c})}}}
function finish(){phase='done';$$('#cards .card').forEach((c,i)=>flipCard(c,cur.items[i]));$('#ovHint').style.display='none';$('#ovActions').classList.add('show')}
function backCrest(){return`<svg viewBox="0 0 100 100" fill="none" stroke="#9fd6ff" stroke-width="2"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="30" stroke-dasharray="4 4"/><path d="M50 18 L58 50 L50 82 L42 50 Z" fill="#9fd6ff" fill-opacity=".25"/><path d="M18 50 L50 42 L82 50 L50 58 Z" fill="#9fd6ff" fill-opacity=".15"/><circle cx="50" cy="50" r="5" fill="#9fd6ff"/></svg>`}
function closeOv(){clearT();phase='idle';ov.classList.remove('show','shake');document.body.style.overflow='';fxRun=false;parts=[];fc.clearRect(0,0,fx.width,fx.height)}
ov.addEventListener('click',()=>{if(phase==='charge')reveal(false);else if(phase==='reveal')finish()});

renderAll();
})();
</script>
</body>
</html>
