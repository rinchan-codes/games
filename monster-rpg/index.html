<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツノノコ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --page: #1b2232; --win: #141b2e; --line: #e6d9bb; --text: #f1e9d2; --dim: #a9a28e; --accent: #e8b44a; --bad: #e06a4a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace; overflow-x: hidden; }
#app { max-width: 720px; margin: 0 auto; padding: 12px 16px 20px; }
#stage { position: relative; width: 100%; aspect-ratio: 240 / 176; background: #0e1220; overflow: hidden; border-radius: 4px; box-shadow: 0 0 0 2px #39415a; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#layer { position: absolute; inset: 0; pointer-events: none; }
#layer > * { pointer-events: auto; }
.win { position: absolute; background: var(--win); border: 3px double var(--line); border-radius: 6px; padding: 0.35em 0.6em; font-size: clamp(12px, 2.5vw, 16px); line-height: 1.5; color: var(--text); }
#msg { display: none; left: 2%; right: 2%; bottom: 3%; min-height: 3.9em; cursor: pointer; z-index: 5; white-space: pre-wrap; }
#msg .more { display: inline-block; width: 0; height: 0; margin-left: 0.4em; border: 0.32em solid transparent; border-top: 0.42em solid var(--text); vertical-align: -0.2em; animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#hud { display: none; position: absolute; left: 2%; top: 2.5%; padding: 0.1em 0.6em; font-size: clamp(11px, 2.2vw, 14px); z-index: 4; }
#hud span { margin-right: 0.8em; }
#hud span:last-child { margin-right: 0; }
#hud small { color: var(--dim); }
#hud .hn { color: var(--accent); }
#hud .low { color: var(--bad); }
#hud.danger { border-color: var(--bad); }
.menu { z-index: 6; }
.menu.idle { opacity: 0.75; }
.menu .mt, .info .mt { color: var(--accent); margin-bottom: 0.15em; }
.menu .ml { max-height: 8.2em; overflow-y: auto; scrollbar-width: thin; }
.menu .mi { display: flex; align-items: baseline; gap: 0.3em; padding: 0 0.1em; cursor: pointer; white-space: nowrap; }
.menu .mi .cur { visibility: hidden; color: var(--accent); width: 1em; flex: none; font-size: 0.8em; }
.menu .mi.on .cur { visibility: visible; }
.menu .mi .lb { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.menu .mi .rt { color: var(--dim); }
.menu .mi.dis { color: #6e6a5e; }
.menu .md { border-top: 1px solid #3a4260; margin-top: 0.3em; padding-top: 0.2em; font-size: 0.85em; color: var(--dim); min-height: 2.6em; white-space: normal; }
.info { z-index: 5; }
.info.place { transform: translateX(-50%); white-space: nowrap; }
.info .kv { display: flex; justify-content: space-between; gap: 0.6em; }
.info .kv span { color: var(--dim); }
.info .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 0.8em; margin-bottom: 0.3em; }
.info.stat { font-size: clamp(11px, 2.2vw, 14px); }
.info .note { color: var(--dim); font-size: 0.85em; margin-top: 0.3em; }
.info input { width: 100%; font: inherit; font-size: 1.1em; background: #0e1424; color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 0.2em 0.4em; margin: 0.3em 0; }
.info .row { text-align: right; }
.btn { font: inherit; background: #2a3450; color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 0.15em 0.9em; cursor: pointer; }
#pad { display: none; margin-top: 12px; justify-content: space-between; align-items: center; }
#pad button { font: inherit; background: #2a3248; color: var(--text); border: 2px solid #4a5470; border-radius: 8px; touch-action: none; -webkit-user-select: none; user-select: none; }
#pad button:active { background: #3a4460; }
.dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
.dpad button { font-size: 18px; }
.ab { display: flex; gap: 12px; }
.ab button { width: 84px; height: 56px; font-size: 12px; line-height: 1.3; }
#help { margin-top: 10px; font-size: 13px; color: var(--dim); line-height: 1.7; }
#help b { color: var(--text); font-weight: normal; }
@media (max-width: 640px), (pointer: coarse) {
  #pad { display: flex; }
  #help { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="240" height="176"></canvas>
    <div id="hud" class="win"></div>
    <div id="layer"></div>
    <div id="msg" class="win"></div>
  </div>
  <div id="pad" aria-label="操作ボタン">
    <div class="dpad">
      <span></span><button data-k="up" aria-label="上">▲</button><span></span>
      <button data-k="left" aria-label="左">◀</button><span></span><button data-k="right" aria-label="右">▶</button>
      <span></span><button data-k="down" aria-label="下">▼</button><span></span>
    </div>
    <div class="ab">
      <button data-k="cancel">メニュー<br>もどる</button>
      <button data-k="ok">けってい</button>
    </div>
  </div>
  <p id="help"><b>移動</b> 矢印キー / WASD　<b>決定・会話を送る</b> Z / Enter / スペース　<b>メニュー・もどる</b> X / Esc　メニューはマウスでも選べます。記録は町に入ったときと宿に泊まったときに自動で行います。</p>
</div>

    }
    for (k in s) s[k] = Math.floor(s[k]);
    return s;

      var after = stats(s);
      ["maxhp", "maxmp", "atk", "def", "agi", "int"].forEach(function (k) { ev1.diff[k] = after[k] - before[k]; });
      s.hp += Math.max(0, after.maxhp - before.maxhp); s.mp += Math.max(0, after.maxmp - before.maxmp);
      ev1.learn = skillsOf(s.lv, s.branch).filter(function (x) { return oldSk.indexOf(x) < 0; });

    return { d: Math.max(0, d), crit: crit };

      "苔の里の長老「" + S.name + "や。おまえのツノは、霧をはらう力をもって生まれた」",
      "長老「塔の主をとめねば、この里もいずれ霧にのまれる。……行ってくれるか」",
      "長老「まずは北西の《根の洞》へ。東への道をふさぐ根は、あそこの主が張ったものじゃ」",
      "（矢印キーで移動、Z/Enterで決定、X/Escでメニュー）"
    ]);
    await fadeOut();
    enterMap("field", C.START.x, C.START.y + 1);
    save();
    await fadeIn();
  }

  function enterMap(map, x, y) {
    S.map = map; S.x = x; S.y = y; G.px = x; G.py = y; G.moving = null;
    G.mode = map === "field" ? "field" : "dungeon";
    hud(true);
    if (map !== "field") showPlace(C.DUNGEONS[map].name);
  }
  function showPlace(name) {
    var el = infoWin(esc(name), { left: "50%", top: "8px" }); el.classList.add("place");
    setTimeout(function () { el.remove(); }, 1600);
  }

  // フィールド操作
  var fieldH = {
    key: function (k) {
      if (G.busy || G.moving) return;
      if (k === "cancel") { fieldMenu(); }
      else if (k === "ok") { examine(); }
    }
  };
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  function update() {
    if (!S || (G.mode !== "field" && G.mode !== "dungeon")) return;
    if (G.moving) {
      var m = G.moving, t = Math.min(1, (performance.now() - m.t0) / m.dur);
      G.px = m.fx + (m.tx - m.fx) * t; G.py = m.fy + (m.ty - m.fy) * t;
      if (t >= 1) { G.moving = null; S.x = m.tx; S.y = m.ty; G.px = S.x; G.py = S.y; onStep(); }
      return;
    }
    if (G.busy || focus[focus.length - 1] !== fieldH) { G.tap = null; return; }
    var dir = G.held || G.tap; G.tap = null;
    if (dir) {
      var d = DIRS[dir], nx = S.x + d[0], ny = S.y + d[1];
      if (passable(nx, ny)) { G.moving = { fx: S.x, fy: S.y, tx: nx, ty: ny, t0: performance.now(), dur: 120 }; S.steps++; }
      else bump(nx, ny);
    }
  }
  var lastBump = 0;
  async function bump(x, y) {
    var c = tileAt(x, y);
    if (S.map !== "field" || performance.now() - lastBump < 400) return;
    var msg = null;
    if (c === "R") msg = "ねじれた根が道をふさいでいる。びくともしない。根の洞の主が張ったものらしい。";
    else if (c === "B") msg = "大きな岩が積みかさなっている。奥の坑道から、岩の鳴く声がひびいてくる。";
    else if (c === "W") msg = "霧の川。足を入れると、重たい霧に押しもどされる。湖の沈み社から霧が流れてくるようだ。";
    if (!msg) return;
    lastBump = performance.now(); G.held = null;
    G.busy = true; await say(msg); G.busy = false; lastBump = performance.now();
  }
  async function examine() {
    // 足元か正面を調べる…は省略。Zでメニューを開かず、ヒントを出す
    G.busy = true;
    var dg = curDg();
    await say(dg ? dg.name + "。" + (dg.boss && !S.flags[dg.boss.flag] ? "奥から、いやな気配がする。" : "しずかだ。") : fieldHint());
    G.busy = false;
  }
  function fieldHint() {
    if (!S.flags.b1) return "根の洞は、苔の里の北にある。山のふもとの穴だ。";
    if (!S.flags.b2) return "岩窟の市から北東へ行くと、鳴き岩の坑道がある。";
    if (!S.flags.b3) return "湖のまんなかに沈み社がある。橋をわたって行けそうだ。";
    return "西の灰の荒野の奥に、灰の塔がそびえている。";
  }

  async function onStep() {
    var c = tileAt(S.x, S.y), dg = curDg();
    G.busy = true;
    try {
      if (!dg) {
        if (C.TOWNS[c]) { await town(c); return; }
        if (C.ENTRANCES[c]) { await goDungeon(C.ENTRANCES[c], "E"); return; }
        var z = C.zoneAt(S.x, S.y);
        if (c !== "=" && c !== "W" && Math.random() < C.ENC[z].rate * (c === "f" ? 1.5 : 1)) { await encounter(z, z); return; }
      } else {
        if (c === "E") { await leaveDungeon(); return; }
        if (c === ">") { await goDungeon(dg.down, "<"); return; }
        if (c === "<") { await goDungeon(dg.up, ">"); return; }
        if (c === "$") { await openChest(); return; }
        if (c === "S") { await spring(); return; }
        if (c === "X" && dg.boss && !S.flags[dg.boss.flag]) { await bossEvent(dg); return; }
        if (dg.enc && Math.random() < C.ENC[dg.enc].rate) { await encounter(dg.enc, dg.pal); return; }
      }
    } finally { G.busy = false; }
  }

  async function goDungeon(id, at) {
    sfx("step");
    await fadeOut();
    if (!S.map || S.map === "field") S.lastField = { x: S.x, y: S.y };
    var p = findTile(C.DUNGEONS[id].map, at);
    enterMap(id, p.x, p.y);
    await fadeIn();
  }
  async function leaveDungeon() {
    await fadeOut();
    var p = S.lastField || C.START;
    enterMap("field", p.x, p.y);
    await fadeIn();
  }
  async function openChest() {
    var key = S.map + ":" + S.x + "," + S.y;
    if (S.chests[key]) return;
    var dg = curDg(), m = dg.map, idx = 0;
    for (var y = 0; y < m.length; y++) for (var x = 0; x < m[0].length; x++) if (m[y].charAt(x) === "$") { if (x === S.x && y === S.y) { y = 99; break; } idx++; }
    var c = dg.chests[idx];
    S.chests[key] = 1; sfx("chest");
    if (!c) { await say("宝箱はからっぽだった。"); return; }
    if (c[0] === "gold") { S.gold += c[1]; await say("宝箱をあけた。" + c[1] + "粒の光る粒が入っていた！"); }
    else if (c[0] === "item") { S.items[c[1]] = (S.items[c[1]] || 0) + c[2]; await say("宝箱をあけた。" + C.ITEMS[c[1]].name + "を" + c[2] + "つ手に入れた！"); }
    else {
      S.bag.push(c[1]); var e = C.EQUIPS[c[1]];
      await say("宝箱をあけた。" + e.name + "を手に入れた！");
      if (await yesno(e.name + "（" + equipText(e) + "）を、いま装備しますか？")) equipItem(c[1]);
    }
    hud(true);
  }
  async function spring() {
    var st = C.stats(S);
    if (S.hp === st.maxhp && S.mp === st.maxmp) { await say("澄んだ泉がわいている。"); return; }
    S.hp = st.maxhp; S.mp = st.maxmp; sfx("heal"); G.flash = 8; G.flashColor = "#9ad0f0"; hud(true);
    await say("澄んだ泉の水を飲んだ。HPとMPがすっかり回復した！");
  }

  // ---------- 町 ----------
  var TALK = {
    "1": function () {
      if (!S.flags.b1) return ["長老「根の洞の主ネジレ根は、毒の根をもつ。気つけの実を持っていくとよい」", "苔の子「道具屋の帰り羽根を使うと、この里まで一瞬で戻れるんだって」", "物知りのコケ「強くなると、体が熱くなって姿が変わる。そのとき選んだ道は、もうやり直せないよ」"];
      return ["長老「根がほどけたか。東の岩の谷には岩窟の市がある。旅のしたくはそこで整えるとよい」", "苔の子「" + S.name + "、かっこよくなったね！」"];
    },
    "2": function () {
      if (!S.flags.b2) return ["市の番人「北の道は落石でふさがってる。坑道の奥でイワナキが鳴くたびに崩れるんだ」", "鍛冶のイワ「イワナキは力をためてから殴ってくる。身をまもって受ければ、ずいぶん楽になるぞ」", "行商「坑道は東の山のふもと。中は入り組んでるから、宝箱を探すつもりで歩くといい」"];
      return ["市の番人「落石がくずれて北への道が通れるようになった。しずく村は湖のそばだ」", "鍛冶のイワ「坑道の宝箱のツメ、使ってるか？ あれは鳴き岩でできてる」"];
    },
    "3": function () {
      if (!S.flags.b3) return ["村のおばば「沈み社の主カゲウオは、眠りをさそう声を出す。気つけの実を忘れずにね」", "漁師のヒレ「社は湖の中だよ。北の岸から橋がかかってる」", "子ども「西の川は霧が濃くて渡れないの。社の主がいなくなれば晴れるって」"];
      return ["村のおばば「霧の川が晴れた。西は灰の荒野。灰よけの宿で休んでからお行き」", "漁師のヒレ「湖の水が澄んできた。ありがとうよ」"];
    },
    "4": function () {
      return ["宿のあるじ「灰の塔はこの北西。2階には塔を守る番兵がいる」", "旅のモンスター「塔の頂上には泉がある。王の前でひと息つけるはずだ」", "宿のあるじ「王は、もとは塔の守り神だったと聞く。いつから灰を吐くようになったのか……」"];
    }
  };
  async function town(id) {
    G.town = id; S.town = id;
    var t = C.TOWNS[id];
    await fadeOut();
    G.mode = "town"; hud(true);
    var ok = save();
    await fadeIn();
    if (!S.visited) S.visited = {};
    var first = !S.visited[id]; S.visited[id] = 1;
    if (first) await say(t.name + "に着いた。" + (ok ? "（ここまでを記録しました）" : "（この環境では記録できません）"));
    var cur = 0;
    for (;;) {
      var items = [{ label: "はなしを聞く" }, { label: "宿にとまる", right: t.inn + "粒" }, { label: "どうぐ屋" }, { label: "ツメ・カラ屋" }, { label: "つよさ・そうび" }, { label: "町を出る" }];
      var gw = infoWin("粒 " + S.gold, { right: "8px", top: "8px", width: "30%" });
      var i = await choose(items, { left: "8px", top: "34px", width: "44%", start: cur, cancel: true });
      gw.remove();
      if (i >= 0) cur = i;
      if (i === 0) await sayAll(TALK[id]());
      else if (i === 1) await inn(t);
      else if (i === 2) await shopItems(t);
      else if (i === 3) await shopEquip(t);
      else if (i === 4) await statusMenu();
      else if (i === 5 || i === -1) break;
    }
    save();
    await fadeOut();
    G.mode = "field"; hud(true);
    await fadeIn();
  }
  async function inn(t) {
    if (S.gold < t.inn) { await say("粒がたりない。"); return; }
    if (!(await yesno("ひと晩" + t.inn + "粒です。とまっていきますか？"))) return;
    S.gold -= t.inn;
    var st = C.stats(S); S.hp = st.maxhp; S.mp = st.maxmp;
    await fadeOut(); sfx("heal"); await wait(400); await fadeIn(); hud(true);
    save();
    await say("ぐっすり眠った。HPとMPが回復した。（記録しました）");
  }
  async function shopItems(t) {
    var cur = 0;
    for (;;) {
      var gw = infoWin("粒 " + S.gold, { right: "8px", top: "8px", width: "30%" });
      var list = t.items.map(function (id) { var it = C.ITEMS[id]; return { label: it.name, right: it.price + "粒", desc: it.desc + "（持っている数：" + (S.items[id] || 0) + "）", disabled: S.gold < it.price }; });
      var i = await choose(list, { left: "8px", top: "34px", width: "62%", start: cur, desc: true, title: "どれを買う？" });
      gw.remove();
      if (i < 0) return;
      cur = i;
      var id = t.items[i], it = C.ITEMS[id];
      if ((S.items[id] || 0) >= 20) { await say("それ以上は持てない。"); continue; }
      S.gold -= it.price; S.items[id] = (S.items[id] || 0) + 1; sfx("ok");
    }
  }
  function equipText(e) {
    var p = [], names = { atk: "攻", def: "守", agi: "速", int: "魔", hp: "HP", mp: "MP" };
    for (var k in names) if (e[k]) p.push(names[k] + "+" + e[k]);
    return p.join(" ");
  }
  function equipItem(id) {
    var e = C.EQUIPS[id], before = C.stats(S);
    S.equip[e.slot] = id;
    var after = C.stats(S);
    S.hp = Math.min(after.maxhp, S.hp + Math.max(0, after.maxhp - before.maxhp));
    S.mp = Math.min(after.maxmp, S.mp + Math.max(0, after.maxmp - before.maxmp));
    hud(true);
  }
  async function shopEquip(t) {
    var cur = 0;
    for (;;) {
      var gw = infoWin("粒 " + S.gold, { right: "8px", top: "8px", width: "30%" });
      var list = t.equips.map(function (id) {
        var e = C.EQUIPS[id], owned = S.bag.indexOf(id) >= 0;
        var now = S.equip[e.slot] ? C.EQUIPS[S.equip[e.slot]] : null;
        return { label: e.name, right: owned ? "持っている" : e.price + "粒", disabled: owned || S.gold < e.price,
          desc: C.SLOTS[e.slot] + "：" + equipText(e) + "（いま：" + (now ? now.name : "なし") + "）" };
      });
      var i = await choose(list, { left: "8px", top: "34px", width: "70%", start: cur, desc: true, title: "どれを買う？" });
      gw.remove();
      if (i < 0) return;
      cur = i;
      var id = t.equips[i], e = C.EQUIPS[id];
      S.gold -= e.price; S.bag.push(id); sfx("ok");

    }
  }

  // ---------- フィールドメニュー ----------
  async function fieldMenu() {
    G.busy = true; G.held = null;
    var cur = 0;
    for (;;) {
      var i = await choose([{ label: "どうぐ" }, { label: "わざ" }, { label: "つよさ・そうび" }, { label: "設定" }, { label: "とじる" }], { right: "8px", top: "8px", width: "36%", start: cur });
      if (i >= 0) cur = i;
      if (i === 0) { if (await itemMenu(false)) break; }
      else if (i === 1) await skillMenu();
      else if (i === 2) await statusMenu();
      else if (i === 3) await settings();
      else break;
    }
    G.busy = false;
  }
  async function itemMenu(inBattle) {
    var ids = Object.keys(S.items).filter(function (k) { return S.items[k] > 0; });
    if (!ids.length) { await say("どうぐを何も持っていない。", inBattle ? { auto: 700 } : null); return null; }
    var list = ids.map(function (id) {
      var it = C.ITEMS[id];
      return { label: it.name, right: "×" + S.items[id], desc: it.desc, disabled: inBattle ? !!it.fieldOnly : !!it.battleOnly };
    });
    var i = await choose(list, { left: "8px", bottom: inBattle ? "8px" : null, top: inBattle ? null : "34px", width: "62%", desc: true, title: "どうぐ" });
    if (i < 0) return null;
    if (inBattle) return ids[i];
    var id = ids[i], it = C.ITEMS[id], st = C.stats(S);
    if (it.warp) {
      if (curDg() && curDg().pal === "top") { await say("灰の嵐が強く、羽根が舞いあがらない。"); return false; }
      use(id); await say(it.name + "を空に投げた！");
      await fadeOut(); var p = findTile(C.FIELD, S.town || "1"); enterMap("field", p.x, p.y); await fadeIn();
      await town(S.town || "1");
      return true;
    }
    if (it.hp) { if (S.hp >= st.maxhp) { await say("HPはへっていない。"); return false; } var v = Math.min(st.maxhp - S.hp, it.hp); S.hp += v; use(id); sfx("heal"); hud(true); await say(it.name + "をつかった。HPが" + v + "回復した。"); return false; }
    if (it.mp) { if (S.mp >= st.maxmp) { await say("MPはへっていない。"); return false; } var w = Math.min(st.maxmp - S.mp, it.mp); S.mp += w; use(id); sfx("heal"); hud(true); await say(it.name + "をつかった。MPが" + w + "回復した。"); return false; }
    await say(it.desc + "。いまは使っても意味がない。");
    return false;
  }
  function use(id) { S.items[id]--; if (S.items[id] <= 0) delete S.items[id]; }
  async function skillMenu() {
    var sk = C.skillsOf(S.lv, S.branch);
    if (!sk.length) { await say("まだ、わざを覚えていない。"); return; }
    for (;;) {
      var list = sk.map(function (id) { var k = C.SKILLS[id]; return { label: k.name, right: "MP" + k.mp, desc: k.desc + (k.field ? "" : "（戦闘中のみ）"), disabled: !k.field || S.mp < k.mp }; });
      var i = await choose(list, { left: "8px", top: "34px", width: "62%", desc: true, title: "わざ" });
      if (i < 0) return;
      var k = C.SKILLS[sk[i]], st = C.stats(S);
      if (S.hp >= st.maxhp) { await say("HPはへっていない。"); continue; }
      S.mp -= k.mp;
      var v = Math.min(st.maxhp - S.hp, Math.round(k.lo + Math.random() * (k.hi - k.lo) + st.int * k.k));
      S.hp += v; sfx("heal"); hud(true);
      await say(S.name + "は" + k.name + "をつかった。HPが" + v + "回復した。");

  async function statusMenu() {

  // ---------- 戦闘 ----------
  async function encounter(encId, bg) {
    G.held = null;
    var ids = C.pickGroup(encId, Math.random);
    await battle(ids, { bg: bg });
  }
  async function bossEvent(dg) {
    var lines = {
      nejire: ["ねじれた根のかたまりが、ぎしぎしと起き上がった！", "ネジレ根「ここは わしの根の中……出てゆけぬぞ」"],
      iwanaki: ["坑道の奥で、岩のかたまりが鳴いている。", "イワナキ「ゴオオ……ウルサイ……ミンナ、ウメテヤル」"],
      kageuo: ["水の底から、黒い影がゆっくり浮かんでくる。", "カゲウオ「霧は心地よい……おまえも、ねむれ」"],
      banpei: ["灰をまとった番兵が、槍をかまえて立ちはだかった。", "灰の番兵「ここから先へは通さぬ。王は灰の中で眠りたいのだ」"],
      hainoou: ["玉座に、灰をまとった大きな影が座っている。", "灰の王「小さき角よ。灰はすべてを等しく静かにする。争いも、飢えも、もうない」", "灰の王「……おまえのツノの光は、まぶしすぎる。ここで消えよ」"]
    }[dg.boss.id];
    await sayAll(lines);
    var res = await battle([dg.boss.id], { boss: true, bg: dg.pal });
    if (res !== "win") return;
    S.flags[dg.boss.flag] = 1;
    var after = {
      b1: ["ネジレ根はちぢんで、ただの枯れ根になった。", "遠くで、なにかがほどける音がした。東への根の壁が消えたようだ！"],
      b2: ["イワナキの鳴き声がやんだ。", "遠くで岩がくずれる音がした。北への道がひらけたようだ！"],
      b3: ["カゲウオは光の粒になって水にとけた。", "湖の霧が晴れていく。西の霧の川も、渡れるようになったはずだ！"],
      b4: ["灰の番兵は、灰の山になってくずれた。", "奥の階段の先から、冷たい風がふいてくる。"]
    }[dg.boss.flag];
    if (after) await sayAll(after);
    if (dg.boss.flag === "end") await ending();
  }

  async function battle(ids, o) {
    o = o || {};
    G.held = null;
    sfx("enc");
    for (var f = 0; f < 3; f++) { G.flash = 4; G.flashColor = "#ffffff"; await wait(90); }
    var core = C.startBattle(S, ids, Math.random, { boss: !!o.boss });
    G.battle = { core: core, bg: o.bg || "A", vis: ids.map(function () { return { blink: 0, fade: 0, gone: false, lunge: 0, glow: 0 }; }) };
    var prevMode = G.mode;
    G.mode = "battle"; hud(true);
    var names = uniqNames(core.es);
    await say(names + (ids.length > 1 ? "があらわれた！" : "があらわれた！"), { auto: 900 });
    var lastCmd = 0;
    while (!core.over) {
      var act = await command(core, lastCmd);
      lastCmd = act.cmd;
      var ev = C.runTurn(core, act);
      for (var i = 0; i < ev.length; i++) await playEvent(core, ev[i]);
    }
    var result = core.result;
    if (result === "win") {
      var r = core.reward;
      await say(uniqNames(core.es) + "をやっつけた！", { auto: 900 });
      if (r.exp) await say(r.exp + "の経験値と" + r.gold + "粒を手に入れた。", { auto: 1100 });
      S.gold += r.gold;
      for (var d = 0; d < r.drops.length; d++) { S.items[r.drops[d]] = (S.items[r.drops[d]] || 0) + 1; await say("敵が" + C.ITEMS[r.drops[d]].name + "を落としていった。", { auto: 1000 }); }
      var lv = C.gainExp(S, r.exp);
      await levelUps(lv);
    }
    G.battle = null;
    if (result === "lose") { await defeat(); return "lose"; }
    G.mode = prevMode === "battle" ? (S.map === "field" ? "field" : "dungeon") : prevMode;
    hud(true); hideMsg();
    return result;
  }
  function uniqNames(es) {
    var seen = [], out = [];
    es.forEach(function (e) { if (seen.indexOf(e.d.name) < 0) { seen.push(e.d.name); var n = es.filter(function (x) { return x.d === e.d; }).length; out.push(e.d.name + (n > 1 ? "たち" : "")); } });
    return out.join("と");
  }
  async function command(core, start) {
    for (;;) {
      hideMsg();
      var cmds = [{ label: "たたかう" }, { label: "わざ" }, { label: "どうぐ" }, { label: "みをまもる" }, { label: "にげる" }];
      var i = await choose(cmds, { left: "8px", bottom: "8px", width: "40%", start: start, cancel: false, cls: "cmd" });
      if (i === 0) { var t = await target(core); if (t < 0) continue; return { type: "attack", target: t, cmd: 0 }; }
      if (i === 1) {
        var sk = C.skillsOf(S.lv, S.branch);
        if (!sk.length) { await say("まだ、わざを覚えていない。", { auto: 800 }); continue; }
        var list = sk.map(function (id) { var k = C.SKILLS[id]; return { label: k.name, right: "MP" + k.mp, desc: k.desc, disabled: S.mp < k.mp }; });
        var j = await choose(list, { left: "8px", bottom: "8px", width: "70%", desc: true, title: "わざ  MP " + S.mp });
        if (j < 0) continue;
        var k = C.SKILLS[sk[j]], tg = 0;
        if ((k.kind === "phys" || k.kind === "mag" || k.kind === "shell") && k.tgt === "one") { tg = await target(core); if (tg < 0) continue; }
        return { type: "skill", id: sk[j], target: tg, cmd: 1 };
      }
      if (i === 2) { var it = await itemMenu(true); if (!it) continue; return { type: "item", id: it, cmd: 2 }; }
      if (i === 3) return { type: "defend", cmd: 3 };
      if (i === 4) return { type: "run", cmd: 4 };
    }
  }
  async function target(core) {
    var al = C.alive(core);
    if (al.length === 1) return al[0].slot;
    var j = await choose(al.map(function (e) { return { label: e.name }; }), { left: "8px", bottom: "8px", width: "50%", title: "どれをねらう？" });
    return j < 0 ? -1 : al[j].slot;
  }
  async function playEvent(core, e) {
    var vis = G.battle.vis;
    switch (e.fx) {
      case "hitE": sfx("hit"); vis[e.i].blink = 12; break;
      case "die": sfx("die"); vis[e.i].fade = 12; break;
      case "hitP": sfx("hurt"); G.shake = 10; G.flash = 4; G.flashColor = "#c03020"; break;
      case "cast": sfx("magic"); G.flash = 5; G.flashColor = "#f0e8c0"; break;
      case "heal": case "buff": sfx("heal"); break;
      case "eatk": vis[e.i].lunge = 8; break;
      case "emag": sfx("magic"); vis[e.i].glow = 14; break;
      case "eheal": sfx("heal"); vis[e.i].glow = 10; break;
      case "rage": sfx("enc"); G.flash = 10; G.flashColor = "#401010"; G.shake = 16; break;
      case "dead": G.flash = 12; G.flashColor = "#601010"; break;
    }
    S.hp = e.hp; S.mp = e.mp; hud(true);
    await say(e.t, { auto: e.fx === "dead" ? 1400 : 750 });
  }
  async function levelUps(evs) {
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      sfx("lv");
      await say(S.name + "はレベル" + ev.lv + "にあがった！", { auto: 1200 });
      if (ev.evolve) { await evolveScene(); var more = C.gainExp(S, 0); if (more.length) await levelUps(more); continue; }
      var d = ev.diff, parts = [];
      if (d.maxhp) parts.push("HP+" + d.maxhp); if (d.maxmp) parts.push("MP+" + d.maxmp); if (d.atk) parts.push("攻+" + d.atk); if (d.def) parts.push("守+" + d.def); if (d.agi) parts.push("速+" + d.agi); if (d.int) parts.push("魔+" + d.int);
      if (ev.evolve2) {
        G.showPlayer = true;
        sfx("evo"); G.flash = 20; G.flashColor = "#ffffff"; hud(true);
        await say(S.name + "の体が光につつまれた……！");
        await say(S.name + "は" + C.formName(S) + "に進化した！");
        G.showPlayer = false;
      }
      if (parts.length) await say(parts.join("  "), { auto: 1300 });
      for (var j = 0; j < ev.learn.length; j++) await say(S.name + "は" + C.SKILLS[ev.learn[j]].name + "を覚えた！");
    }
    hud(true);
  }
  async function evolveScene() {
    G.showPlayer = true;
    try { await evolveInner(); } finally { G.showPlayer = false; }
  }
  async function evolveInner() {
    await say(S.name + "の体が熱くなってきた……！");
    await say("どの姿に進化する？ 一度選ぶと、やり直せない。");
    var keys = ["kiba", "koura", "tomo"];
    for (;;) {
      var i = await choose(keys.map(function (k) { var b = C.BRANCH[k]; return { label: b.name + "（" + b.form1 + "）", desc: b.desc }; }), { left: "8px", top: "8px", width: "84%", desc: true, cancel: false, title: "進化先" });
      var b = C.BRANCH[keys[i]];
      if (!(await yesno(b.form1 + "に進化します。よろしいですか？"))) continue;
      var r = C.evolve(S, keys[i]);
      sfx("evo");
      for (var f = 0; f < 4; f++) { G.flash = 6; G.flashColor = "#ffffff"; await wait(160); }
      hud(true);
      await say(S.name + "は" + b.form1 + "に進化した！");
      var d = r.diff, parts = [];
      if (d.maxhp) parts.push("HP+" + d.maxhp); if (d.maxmp) parts.push("MP+" + d.maxmp); if (d.atk) parts.push("攻+" + d.atk); if (d.def) parts.push("守+" + d.def); if (d.agi) parts.push("速+" + d.agi); if (d.int) parts.push("魔+" + d.int);
      await say(parts.join("  "));
      for (var j = 0; j < r.learn.length; j++) await say(S.name + "は" + C.SKILLS[r.learn[j]].name + "を覚えた！");
      return;
    }
  }
  async function defeat() {
    await say("目の前がまっくらになった……");
    await fadeOut();
    S.gold = Math.floor(S.gold / 2);
    var st = C.stats(S); S.hp = st.maxhp; S.mp = st.maxmp;
    var id = S.town || "1", p = findTile(C.FIELD, id);
    enterMap("field", p.x, p.y);
    G.mode = "town"; G.town = id;
    save();
    await fadeIn();
    await say("気がつくと、" + C.TOWNS[id].name + "で寝かされていた。粒が半分になってしまった。");
    G.mode = "field";
    // 町のメニューを開く
    await town(id);
  }

  async function ending() {
    await fadeOut();
    G.mode = "ending"; hud(false);
    await fadeIn();
    await sayAll([
      "灰の王の体から、灰がさらさらと落ちていく。",
      "あとに残ったのは、苔むした古い石像だった。",
      "塔をつつんでいた霧が晴れ、ハザマの地に風がもどってくる。",
      "我を忘れていたモンスターたちも、ひとり、またひとりと目をさました。",
      S.name + "は、" + C.formName(S) + "の姿で苔の里へ帰っていった。"
    ]);
    S.cleared = true; save();
    var w = infoWin('<div class="mt">おわり</div><div class="kv"><span>' + esc(S.name) + "</span><b>" + C.formName(S) + " Lv" + S.lv + '</b></div><div class="kv"><span>プレイ時間</span><b>' + fmtTime(S.time) + '</b></div><div class="note">遊んでくれてありがとう。</div>', { left: "15%", width: "70%", top: "20%" });
    await choose([{ label: "タイトルへ" }], { left: "35%", width: "30%", bottom: "12px", cancel: false });
    w.remove();
    G.ending = true;
  }

  // ---------- メインループ ----------
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  async function main() {
    try {
      focus.length = 0;
      await title();
      pushFocus(fieldH);
    } catch (e) { if (e !== "title") throw e; }
  }
  // エンディング後はタイトルへ
  setInterval(function () { if (G.ending) { G.ending = false; main(); } }, 300);
  // 未捕捉の"title"は無視
  window.addEventListener("unhandledrejection", function (ev) { if (ev.reason === "title") ev.preventDefault(); });

  loop();
  if (document.fonts && document.fonts.load) document.fonts.load("14px 'DotGothic16'").catch(function () {});
  main();
  // 動作確認用（ゲームには影響しない）
  window.__dbg = { G: G, S: function () { return S; }, setS: function (v) { S = v; }, passable: function (x, y) { return passable(x, y); }, tileAt: function (x, y) { return tileAt(x, y); }, focus: function () { return focus.length; }, enterMap: enterMap, hud: hud };
})();
</script>
</body>
